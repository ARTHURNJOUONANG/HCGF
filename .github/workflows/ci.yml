name: CI

on:
  push:
    branches: [main, vitrine, "claude/**"]
  pull_request:

jobs:
  qualite:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./ci.db
      AUTH_SECRET: ci-secret-0123456789abcdef0123456789
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx prisma migrate deploy
      - run: npm run build

  migrations-postgres:
    name: Migrations Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hcgf
          POSTGRES_PASSWORD: hcgf
          POSTGRES_DB: hcgf
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hcgf" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://hcgf:hcgf@localhost:5432/hcgf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Appliquer les migrations sur une base vide
        run: node scripts/migrer-postgres.mjs
      - name: Vérifier que les migrations couvrent tout le schéma
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/postgres/schema.prisma --exit-code
